spring.application.name=mult-databases


# Database postgresql config
spring.datasource1.driver-class-name=org.postgresql.Driver
spring.datasource1.username=sai
spring.datasource1.password=sai
spring.datasource1.url=jdbc:postgresql://localhost:5432/water


# Database H2 Memory config
spring.datasource2.driver-class-name=org.h2.Driver
spring.datasource2.username=sa
spring.datasource2.password=sa
spring.datasource2.url=jdbc:h2:file:~/h2/database

spring.jpa.show-sql=true

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true